<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Closed outside Socials</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #15161b; color: #e8e8ea;
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
  main { text-align: center; max-width: 420px; padding: 24px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  p { margin: 0 0 6px; color: #a0a1a8; }
  .site { color: #e8e8ea; }
  .aside { margin-top: 18px; font-style: italic; color: #75767d; }
  kbd { font: 13px -apple-system, sans-serif; padding: 1px 6px; border-radius: 5px;
        background: #2a2b33; border: 1px solid #3a3b44; color: #e8e8ea; }
</style>
</head>
<body>
<main>
  <h1>Closed while you're in <span id="mode">this mode</span></h1>
  <p><span class="site" id="site">This site</span> opens in Socials.</p>
  <p>Switch with <kbd>⌥3</kbd> or the dock, and this tab comes back by itself.</p>
  <p class="aside">It will still be there after your break.</p>
</main>
<script src="blocked.js"></script>
</body>
</html>
